name: Verificar API
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Testar avaliação, contexto, autenticação e troca de chaves
        run: uv run python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verificar bundle Python do Cloudflare
        run: uv run pywrangler deploy --dry-run
